name: Update data harian

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 18:00 WIB, Senin–Jumat (setelah bursa tutup)
  workflow_dispatch:          # tombol "Run workflow" (dipanggil dari tombol Update di aplikasi)

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install pandas numpy yfinance pyarrow

      - name: Unduh data & buat dashboard
        run: python watchlist_ara.py --no-open

      - name: Simpan ke GitHub Pages
        run: |
          git config user.name "aan-watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html status.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Update data otomatis $(jq -r .data_sampai status.json)"
            git pull --rebase -X theirs
            git push
          fi
